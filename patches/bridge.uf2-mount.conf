# /etc/systemd/system/meshcore-tdoa-gateway-bridge.service.d/uf2-mount.conf
#
# Installed by meshcore-tdoa-apply-patches.sh. Required until the
# equivalent ReadWritePaths/DeviceAllow entries land in the packaged
# unit at debian/meshcore-tdoa-gateway-bridge.service.
#
# Why: the bridge's T-Echo OTA path mounts the Adafruit nRF52
# bootloader's TECHOBOOT MSC volume to drag-drop a UF2 onto it.
#   1. The packaged unit's ProtectSystem=strict + ReadWritePaths
#      leaves /mnt read-only, so the bridge can't bind-mount the
#      bootloader volume.
#   2. The packaged unit's DeviceAllow=char-* rw is whitelist-only,
#      so block devices (/dev/sda* — the TECHOBOOT volume's underlying
#      disk node) are blocked from open(2).
[Service]
ReadWritePaths=/mnt/techoboot
DeviceAllow=block-sd rw

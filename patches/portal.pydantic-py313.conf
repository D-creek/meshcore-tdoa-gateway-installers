# /etc/systemd/system/meshcore-tdoa-gateway-portal.service.d/pydantic-py313.conf
#
# Installed by meshcore-tdoa-apply-patches.sh. Required until the
# packaged venv is rebuilt with pydantic>=1.10.18.
#
# Why: Python 3.13 added a 'recursive_guard' kwarg to
# ForwardRef._evaluate(); pydantic 1.10.x only handles that from
# 1.10.18 onward. The packaged venv bundles 1.10.13, so a fresh
# install on a 3.13 host crash-loops with TypeError at import.
#
# Fix: pin the patched venv on every service start (no-op when
# already current; ~1 s otherwise). Requires the venv dir to be
# writable inside the hardened sandbox; the packaged unit's
# ReadWritePaths doesn't include it, so add here.
[Service]
ReadWritePaths=/opt/meshcore-tdoa-gateway-portal/venv
ExecStartPre=/opt/meshcore-tdoa-gateway-portal/venv/bin/pip install --quiet --disable-pip-version-check pydantic>=1.10.18,<2
